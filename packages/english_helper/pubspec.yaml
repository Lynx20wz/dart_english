name: english_helper
description: Flutter application for English-Russian dictionary.
version: 0.2.0
repository: https://github.com/Lynx20wz/dart_english
publish_to: none

resolution: workspace

flutter:
  uses-material-design: true

environment:
  sdk: ^3.10.0
  flutter: ^3.38.5

dependencies:
  english_core:
    path: ../english_core
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.2.1
  audioplayers: ^6.5.1
  toastification: ^3.0.3
  url_launcher: ^6.3.2
  sqlite3: ^3.3.2
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2

dev_dependencies:
  build_runner: ^2.15.0
